name: bookipi-flash-sale-frontend

services:
  frontend:
    build:
      context: ../../../..
      dockerfile: app/frontend/build/docker/dockerfile
      target: runner
    image: bookipi-flash-sale-frontend:latest
    container_name: bookipi-flash-sale-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    environment:
      - VITE_FLASH_SALE_DEFAULT_SALE_ID=${VITE_FLASH_SALE_DEFAULT_SALE_ID:-default}
      - VITE_FLASH_SALE_API_BASE_URL=${VITE_FLASH_SALE_API_BASE_URL:-http://localhost:3000}
    restart: unless-stopped
