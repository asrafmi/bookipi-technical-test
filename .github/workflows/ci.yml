name: CI

on:
  push:
  pull_request:

env:
  NODE_VERSION: "22"

jobs:
  backend-typecheck:
    name: Backend / typecheck + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/backend/package-lock.json
      - run: npm ci
        working-directory: app/backend
      - run: npx tsc --noEmit
        working-directory: app/backend
      - run: npm run lint
        working-directory: app/backend

  backend-unit-test:
    name: Backend / unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/backend/package-lock.json
      - run: npm ci
        working-directory: app/backend
      - run: npm test
        working-directory: app/backend

  backend-integration-test:
    name: Backend / integration tests (real Postgres + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: flash_sale
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d flash_sale"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: flash_sale
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_POOL_MAX: "50"
      REDIS_HOST: localhost
      REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/backend/package-lock.json
      - run: npm ci
        working-directory: app/backend
      # validate-env.ts only requires PORT etc. outside NODE_ENV=test, but the app
      # still reads app/backend/.env at boot via ConfigModule — an empty file is
      # enough since every value above is supplied as a real env var already.
      - run: touch .env
        working-directory: app/backend
      - run: npm run db:migrate
        working-directory: app/backend
      - run: npm run test:integration
        working-directory: app/backend

  frontend-lint-build:
    name: Frontend / lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci
        working-directory: app/frontend
      - run: npm run lint
        working-directory: app/frontend
      - run: npm run build
        working-directory: app/frontend
