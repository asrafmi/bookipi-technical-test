name: bookipi-flash-sale-backend

services:
  backend:
    build:
      context: ../../
      dockerfile: build/docker/dockerfile
      target: runner
    image: bookipi-flash-sale-backend:latest
    container_name: bookipi-flash-sale-backend
    env_file:
      - ../../.env
    environment:
      # override .env's host-facing values — inside the compose network,
      # Postgres and Redis are reachable by service name, not localhost
      - DB_HOST=db
      - REDIS_HOST=redis
      # Prod is expected to take real concurrent purchase load (see the oversell
      # test in flash-sale.integration.test.ts) — the postgres-js/Fastify defaults
      # this app falls back to otherwise are sized for light/local use.
      - DB_POOL_MAX=${DB_POOL_MAX:-50}
      - HTTP_KEEP_ALIVE_TIMEOUT_MS=${HTTP_KEEP_ALIVE_TIMEOUT_MS:-30000}
      - HTTP_CONNECTION_TIMEOUT_MS=${HTTP_CONNECTION_TIMEOUT_MS:-30000}
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # See the base docker-compose.yml's `backend` service for why this is here —
    # the container's own network namespace has its own accept-queue limit,
    # independent of any sysctl raised on the host.
    sysctls:
      - net.core.somaxconn=65535
      - net.ipv4.tcp_max_syn_backlog=65535

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-flash_sale}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    # See the base docker-compose.yml's `db` service for why — headroom above
    # DB_POOL_MAX so psql/migrations/monitoring always have a free slot.
    command: ["postgres", "-c", "max_connections=200"]
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./volumes/postgres_data:/var/lib/postgresql/data
    sysctls:
      - net.core.somaxconn=65535
      - net.ipv4.tcp_max_syn_backlog=65535
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-flash_sale}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./volumes/redis_data:/data
    sysctls:
      - net.core.somaxconn=65535
      - net.ipv4.tcp_max_syn_backlog=65535
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
