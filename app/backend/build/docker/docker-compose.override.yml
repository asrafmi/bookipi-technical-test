name: bookipi-flash-sale-backend

services:
  backend:
    build:
      context: ../../
      dockerfile: build/docker/dockerfile
      target: base
    working_dir: /app/backend
    environment:
      - NODE_ENV=development
      - DB_HOST=db
      - REDIS_HOST=redis
    env_file:
      - ../../.env
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ../../:/app/backend
      - /app/backend/node_modules
    command: sh -c "npm run dev"
