services:
  frontend:
    build:
      context: ../../
      dockerfile: build/docker/dockerfile
      target: base
    working_dir: /app/frontend
    environment:
      - NODE_ENV=development
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ../../:/app/frontend
      - /app/frontend/node_modules
    command: sh -c "npm run dev -- --host 0.0.0.0"
